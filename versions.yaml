    observed_latest: "v2.29.0"
    probe: "curl -fsSL https://api.github.com/repos/grpc-ecosystem/grpc-gateway/releases/latest"
    review:
      status: approved
      reviewer: api-contract-transport
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/grpc-ecosystem/grpc-gateway/releases/tag/v2.29.0", "buf.gen.yaml", "go.mod"]
