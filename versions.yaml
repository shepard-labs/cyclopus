      evidence: ["https://raw.githubusercontent.com/kubernetes/client-go/v0.36.2/go.mod", "https://raw.githubusercontent.com/k3s-io/k3s/v1.36.2%2Bk3s1/go.mod", "go.mod"]
      rationale: client-go v0.36.2 matches the Kubernetes v1.36.2 API server embedded in the selected k3s v1.36.2+k3s1 (supported skew is ±1 minor).
  traefik:
    pin: "v3.7.6"
