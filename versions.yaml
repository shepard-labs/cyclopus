schema_version: 1
policy:
  probe_before_each_phase: true
  pin_rule: reviewed_or_documented_intentional_pin
  on_newer_version: record_only
  observed_at: "2026-07-29"
components:
  go:
    pin: "1.26"
    observed_latest: "1.26.5"
    probe: "curl -fsSL https://go.dev/VERSION?m=text"
    review:
      status: approved
      reviewer: phase-0-workflow-fixer
      reviewed_at: "2026-07-29"
      evidence: ["https://go.dev/VERSION?m=text", "go.mod"]
      rationale: Go 1.26 is the module language/toolchain line; patch selection remains deployment-managed.
  postgres:
    pin: "18"
    observed_latest: "18.4"
    probe: "curl -fsSL https://www.postgresql.org/versions.json"
    review:
      status: approved
      reviewer: phase-0-workflow-fixer
      reviewed_at: "2026-07-29"
      evidence: ["https://www.postgresql.org/versions.json", "tests/workflow/fixtures/pending_sha_pg18.sql"]
      rationale: PostgreSQL 18 is required for native OLD row RETURNING syntax and is contract-tested.
  golang_migrate:
    pin: "v4.19.1"
    observed_latest: "v4.19.1"
    probe: "curl -fsSL https://api.github.com/repos/golang-migrate/migrate/releases/latest"
    review:
      status: approved
      reviewer: schema-foundation
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/golang-migrate/migrate/releases/tag/v4.19.1", "go.mod"]
      rationale: Current stable v4 release supports embedded io/fs sources and PostgreSQL connection instances.
  pgx:
    pin: "v5.10.0"
    observed_latest: "v5.10.0"
    probe: "curl -fsSL 'https://api.github.com/repos/jackc/pgx/tags?per_page=20'"
    review:
      status: approved
      reviewer: schema-foundation
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/jackc/pgx/releases/tag/v5.10.0", "go.mod"]
      rationale: Current stable pgx/v5 release is compatible with Go 1.26 and PostgreSQL 18.
  grpc_go:
    pin: "v1.82.1"
    observed_latest: "v1.82.1"
    probe: "curl -fsSL https://api.github.com/repos/grpc/grpc-go/releases/latest"
    review:
      status: approved
      reviewer: api-contract-transport
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/grpc/grpc-go/releases/tag/v1.82.1", "go.mod"]
