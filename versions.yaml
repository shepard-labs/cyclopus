    observed_latest: "1.12.5"
    probe: "curl -fsSL https://api.github.com/repos/opentofu/opentofu/releases/latest"
    review:
      status: intentional_pin
      reviewer: phase-0-workflow-fixer
      reviewed_at: "2026-07-29"
      evidence: ["https://api.github.com/repos/opentofu/opentofu/releases/latest"]
