      evidence: ["https://github.com/bufbuild/buf/releases/tag/v1.72.0", "buf.yaml", "buf.gen.yaml"]
      rationale: Current stable Buf CLI used for dependency locking, linting, breaking checks, and generation.
  protoc:
    pin: "v35.1"
    observed_latest: "v35.1"
    probe: "curl -fsSL https://api.github.com/repos/protocolbuffers/protobuf/releases/latest"
    review:
      status: approved
      reviewer: api-contract-transport
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/protocolbuffers/protobuf/releases/tag/v35.1"]
