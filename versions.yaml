  robfig_cron:
    pin: "v3.0.1"
    observed_latest: "v3.0.1"
    probe: "go list -m -json github.com/robfig/cron/v3@latest"
    review:
      status: approved
      reviewer: phase-4-scaling-implementer
      reviewed_at: "2026-07-30"
      evidence: ["https://pkg.go.dev/github.com/robfig/cron/v3"]
      rationale: Used for server-side cron expression validation (H6) matching the KEDA v2.20.1 robfig/cron parser; prevents invalid schedules from being accepted that the KEDA operator would reject asynchronously.
