      reviewed_at: "2026-07-30"
      evidence: ["https://api.github.com/repos/openobserve/openobserve/releases/latest"]
      rationale: Logs/traces backend (§8), queried server-side via Cyclopus with mandatory tenant filter, never exposed. Multi-tenant streams keyed by app/environment/release stamped by the Collector.
