      reviewer: api-contract-transport
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/grpc-ecosystem/grpc-gateway/releases/tag/v2.29.0", "buf.gen.yaml", "go.mod"]
      rationale: Current stable v2 gateway release with pinned code generation.
  protobuf_go:
    pin: "v1.36.11"
    observed_latest: "v1.36.11"
    probe: "curl -fsSL https://api.github.com/repos/protocolbuffers/protobuf-go/releases/latest"
