      rationale: client-go v0.33.13 directly requires k8s.io/api and k8s.io/apimachinery v0.33.13 and matches the Kubernetes v1.33.13 API served by the selected k3s patch.
  traefik:
    pin: "v3.4.1"
    observed_latest: "v3.7.9"
    probe: "curl -fsSL https://api.github.com/repos/traefik/traefik/releases/latest"
