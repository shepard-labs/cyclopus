  keda:
    pin: "v2.20.1"
    observed_latest: "v2.20.1"
    probe: "curl -fsSL https://api.github.com/repos/kedacore/keda/releases/latest"
    review:
      status: approved
      reviewer: phase-4-scaling-implementer
      reviewed_at: "2026-07-30"
      evidence: ["https://api.github.com/repos/kedacore/keda/releases/latest"]
      rationale: v2.17.1 was outside its tested Kubernetes window on 1.33; v2.20.1 officially tests Kubernetes 1.33-1.35. RBAC must include events.k8s.io events create/patch and scaledRefKinds restricted to Deployments.
  keda_http_add_on:
    pin: "v0.15.0"
    observed_latest: "v0.15.0"
    probe: "curl -fsSL https://api.github.com/repos/kedacore/http-add-on/releases/latest"
    review:
      status: approved
      reviewer: phase-4-scaling-implementer
      reviewed_at: "2026-07-30"
      evidence: ["https://api.github.com/repos/kedacore/http-add-on/releases/latest"]
      rationale: Beta accepted per spec 3.4 with hpa-mode fallback. HTTPScaledObject http.keda.sh/v1alpha1; uses scalingMetric concurrency/requestRate rather than deprecated targetPendingRequests.
  opentofu:
