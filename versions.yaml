      status: intentional_pin
      reviewer: kubernetes-client-go-recovery
      reviewed_at: "2026-07-29"
      evidence: ["https://github.com/k3s-io/k3s/releases/tag/v1.33.13%2Bk3s1", "https://raw.githubusercontent.com/k3s-io/k3s/v1.33.13%2Bk3s1/go.mod", "https://raw.githubusercontent.com/kubernetes/client-go/v0.33.13/go.mod", "go.mod"]
      rationale: k3s v1.33.13+k3s1 embeds Kubernetes v1.33.13; the adapter uses matching upstream k8s.io api, apimachinery, and client-go v0.33.13 modules.
