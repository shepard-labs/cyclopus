{{- if not .Values.secrets.existingSecret -}}
# Generated only when no existingSecret is provided. In real installs, create the
# Secret out of band (never commit credentials); reference it via
# secrets.existingSecret. These keys map to the CYCLOPUS_* env the binary reads.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cyclopus.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyclopus.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl (or secrets.existingSecret) is required" .Values.secrets.databaseUrl | quote }}
  AUTH_TOKEN_PEPPER: {{ required "secrets.authTokenPepper (or secrets.existingSecret) is required" .Values.secrets.authTokenPepper | quote }}
  AUTH_BOOTSTRAP_SECRET: {{ .Values.secrets.authBootstrapSecret | quote }}
  {{- if .Values.config.phase6.enabled }}
  PHASE6_CREDENTIAL_FINGERPRINT_KEY: {{ required "secrets.phase6CredentialFingerprintKey (or secrets.existingSecret key PHASE6_CREDENTIAL_FINGERPRINT_KEY) is required when config.phase6.enabled=true and must contain at least 32 bytes" .Values.secrets.phase6CredentialFingerprintKey | quote }}
  {{- end }}
  OBSERVABILITY_OPENOBSERVE_CREDENTIAL_SECRET: {{ .Values.secrets.openobserveCredential | quote }}
  OBSERVABILITY_BESZEL_CREDENTIAL_SECRET: {{ .Values.secrets.beszelCredential | quote }}
{{- end }}

{{ $githubAppSecret := lookup "v1" "Secret" .Release.Namespace "cyclopus-github-app" | default dict -}}
{{- $githubAppSecretOwner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $githubAppSecret -}}
{{- $githubAppSecretNamespace := dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $githubAppSecret -}}
{{- $githubAppSecretManager := dig "metadata" "labels" "app.kubernetes.io/managed-by" "" $githubAppSecret -}}
{{- if and $githubAppSecret (or (ne $githubAppSecretOwner .Release.Name) (ne $githubAppSecretNamespace .Release.Namespace) (ne $githubAppSecretManager .Release.Service)) -}}
{{- fail (printf "Secret %s/cyclopus-github-app already exists but is not owned by Helm release %s in namespace %s; do not adopt or delete it blindly: back it up and restore it with its database for migration, or delete it only after the database GitHub App state/application instance has been reset" .Release.Namespace .Release.Name .Release.Namespace) -}}
{{- end }}
{{- $githubLabels := mergeOverwrite (deepCopy (dig "metadata" "labels" dict $githubAppSecret)) (include "cyclopus.labels" . | fromYaml) (dict "cyclopus.app/managed-credential" "true") -}}
{{- $githubAnnotations := mergeOverwrite (deepCopy (dig "metadata" "annotations" dict $githubAppSecret)) (dict "cyclopus.app/credential-purpose" "github-app" "helm.sh/resource-policy" "keep") -}}
---
# Runtime-populated GitHub App credentials. On upgrade, lookup preserves the
# release-owned Secret's metadata and data so Helm does not clear credentials.
# The keep policy retains it on uninstall for a safe same-release reinstall.
apiVersion: v1
kind: Secret
metadata:
  name: cyclopus-github-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $githubLabels | nindent 4 }}
  annotations:
    {{- toYaml $githubAnnotations | nindent 4 }}
type: Opaque
data: {{ dig "data" dict $githubAppSecret | toJson }}
