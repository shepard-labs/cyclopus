{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyclopus.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyclopus.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyclopus.provisionerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyclopus.labels" . | nindent 4 }}
  {{- with .Values.provisionerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cyclopus.provisionerServiceAccountName" . }}-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ include "cyclopus.provisionerServiceAccountName" . }}
  labels:
    {{- include "cyclopus.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
{{- end }}
