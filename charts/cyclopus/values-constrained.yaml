# Constrained-profile overlay for the ovh_vps_constrained integration profile.
#
# Apply on top of values.yaml:
#   helm template cyclopus charts/cyclopus -f charts/cyclopus/values-constrained.yaml
#
# Trims the API pod's footprint so it co-resides with Postgres 18 on a small
# control-plane VPS while still leaving headroom for migrations at boot (§9.3).

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 320Mi

config:
  worker:
    maxConcurrentDeploys: 2
