apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
  namespace: cyclopus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: cyclopus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
    spec:
      containers:
        - name: beszel
          image: henrygd/beszel:0.18.7
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /beszel_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data
---
apiVersion: v1
kind: Service
metadata:
  name: beszel
  namespace: cyclopus
spec:
  selector:
    app: beszel
  ports:
    - port: 8090
      targetPort: 8090
