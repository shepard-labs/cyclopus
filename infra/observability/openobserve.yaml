apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve-data
  namespace: cyclopus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: cyclopus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v0.91.5
          ports:
            - containerPort: 5080
          env:
            - name: ZO_ROOT_USER_EMAIL
              value: admin@cyclopus.local
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-auth
                  key: password
            - name: ZO_DATA_DIR
              value: /data
            - name: ZO_MEMORY_CACHE_MAX_SIZE
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openobserve-data
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: cyclopus
spec:
  selector:
    app: openobserve
  ports:
    - port: 5080
      targetPort: 5080
