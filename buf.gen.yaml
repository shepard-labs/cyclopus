version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.29.0
    out: gen/go
    opt:
      - paths=source_relative
  # OpenAPI for the docs site: same gateway annotations → Swagger 2.0 JSON,
  # then cmd/gen-openapi converts to OpenAPI 3 (internal/apidocs/openapi.json).
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.29.0
    out: gen/openapi
    opt:
      - allow_repeated_fields_in_body=true
