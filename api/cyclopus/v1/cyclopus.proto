  string application_name = 5; string application_slug = 6; string hostname_label = 7; string production_branch = 8;
  string image_repository = 9; bool previews_enabled = 10; int32 container_port = 11; string health_check_path = 12;
  ScalingMode scaling_mode = 13; int32 min_replicas = 14; int32 max_replicas = 15; int32 hpa_target_cpu_percent = 16;
  int32 cpu_request_millicores = 17; int32 cpu_limit_millicores = 18; int32 memory_request_mib = 19;
  int32 memory_limit_mib = 20; int32 max_preview_environments = 21; int32 preview_idle_ttl_hours = 22;
  int32 deploy_timeout_seconds = 23; int32 release_retention_count = 24; RuntimeClass runtime_class = 25;
  repeated KedaCronSchedule keda_cron_schedules = 26; int32 keda_http_target_pending_requests = 27;
