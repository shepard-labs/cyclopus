  TRACE_STATUS_ERROR = 2;
}

enum GitHubAccountType { GITHUB_ACCOUNT_TYPE_UNSPECIFIED = 0; GITHUB_ACCOUNT_TYPE_USER = 1; GITHUB_ACCOUNT_TYPE_ORGANIZATION = 2; }
enum GitHubAppSetupState { GITHUB_APP_SETUP_STATE_UNSPECIFIED = 0; GITHUB_APP_SETUP_STATE_NOT_CONFIGURED = 1; GITHUB_APP_SETUP_STATE_SETUP_IN_PROGRESS = 2; GITHUB_APP_SETUP_STATE_READY = 3; GITHUB_APP_SETUP_STATE_FAILED = 4; GITHUB_APP_SETUP_STATE_ORPHANED = 5; GITHUB_APP_SETUP_STATE_REPLACING = 6; }
