  google.protobuf.Timestamp created_at = 12; google.protobuf.Timestamp updated_at = 13;
}
message GitHubInstallation {
  string id = 1; int64 github_installation_id = 2; int64 account_id = 3; string account_login = 4;
  GitHubAccountType account_type = 5; GitHubInstallationRepositorySelection repository_selection = 6;
  GitHubInstallationLifecycleStatus lifecycle_status = 7; google.protobuf.Timestamp suspended_at = 8;
  google.protobuf.Timestamp deleted_at = 9; google.protobuf.Timestamp synced_at = 10; string settings_url = 11;
  google.protobuf.Timestamp created_at = 12; google.protobuf.Timestamp updated_at = 13;
}
