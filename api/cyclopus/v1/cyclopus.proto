// AuditEvent is one row of the audit_events table: an immutable record of a
// control-plane mutation (§9). before/after carry the prior and resulting
// resource state as JSON objects. These are org-scoped; a caller can only read
// their own org's audit trail. The stored `after` for secret-bearing resources
// (e.g. registries) contains the secret REFERENCE, never a plaintext secret.
message AuditEvent {
  string id = 1;
  string organization_id = 2;
  // actor_user_id is the user who performed the action; empty for
  // system-originated events.
  string actor_user_id = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  // before/after are the JSON object states of the target resource. They are
  // exposed as google.protobuf.Struct because the stored jsonb is always a JSON
  // object (or null), mapping cleanly to Struct; this preserves structure for
  // clients rather than an opaque string.
  google.protobuf.Struct before = 7;
  google.protobuf.Struct after = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListAuditEventsRequest {
  string organization_id = 1;
  // Optional filters. When set, only events whose target matches are returned.
  string target_type = 2;
  string target_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListAuditEventsResponse {
  repeated AuditEvent audit_events = 1;
  string next_page_token = 2;
}

// CertificateStatus is the live status of a cert-manager Certificate serving an
// environment's hostname, read directly from the cluster (read-only, §6). It is
// not stored in Postgres; it is projected from the Certificate CRD's spec and
// status. ready reflects the Ready condition; reason carries the condition's
// message; not_after is the certificate expiry when known.
message CertificateStatus {
  string hostname = 1;
  string secret_name = 2;
  bool ready = 3;
  string reason = 4;
  google.protobuf.Timestamp not_after = 5;
  string issuer = 6;
  repeated string dns_names = 7;
}

message ListCertificatesRequest { string environment_id = 1; }
message ListCertificatesResponse { repeated CertificateStatus certificates = 1; }

message Operation {
  string id = 1;
  OperationStatus status = 2;
  string resource_name = 3;
}

message ReconcileScope {
  ReconcileScopeKind kind = 1;
  string organization_id = 2;
  string application_id = 3;
  string environment_id = 4;
}

message ReconcileFinding {
  ReconcileCategory category = 1;
  ReconcileFindingStatus status = 2;
  string resource_name = 3;
  string summary = 4;
  oneof details {
    RuntimeClassDriftFinding runtime_class_drift = 5;
    NetworkPolicyDriftFinding network_policy_drift = 6;
  }
  google.protobuf.Timestamp observed_at = 7;
}

message RuntimeClassDriftFinding {
  string expected_runtime_class = 1;
  string observed_runtime_class = 2;
}

message NetworkPolicyDriftFinding {
  repeated string missing_policies = 1;
}

message ReconciliationObject {
  string kind = 1;
  string namespace = 2;
  string name = 3;
}

message ReconciliationPlanOperation {
  ReconciliationObject object = 1;
  string desired_hash = 2;
  string observed_hash = 3;
  google.protobuf.Value details = 4;
}

message ReconciliationPlan {
  repeated ReconciliationPlanOperation create = 1;
  repeated ReconciliationPlanOperation patch = 2;
  repeated ReconciliationPlanOperation delete = 3;
}

message ReconciliationReport {
  repeated ReconciliationObject orphans = 1;
  repeated ReconciliationObject pruned = 2;
  int32 planned = 3;
  int32 applied = 4;
  bool dry_run = 5;
}

message ReconciliationEvidence {
  int64 sequence = 1;
  string kind = 2;
  ReconciliationObject object = 3;
  string action = 4;
  string desired_hash = 5;
  string observed_hash = 6;
  google.protobuf.Value details = 7;
  google.protobuf.Timestamp observed_at = 8;
}

message ReconciliationRun {
  string id = 1;
  ReconcileScope scope = 2;
  repeated ReconcileCategory categories = 3;
  OperationStatus status = 4;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  bool dry_run = 8;
  bool prune = 9;
  ReconciliationPlan plan = 10;
  ReconciliationReport report = 11;
  repeated ReconcileFinding findings = 12;
  google.protobuf.Timestamp started_at = 13;
  string error_code = 14;
  string error_message = 15;
}

