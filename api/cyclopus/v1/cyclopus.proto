enum GitHubInstallationRepositorySelection { GITHUB_INSTALLATION_REPOSITORY_SELECTION_UNSPECIFIED = 0; GITHUB_INSTALLATION_REPOSITORY_SELECTION_ALL = 1; GITHUB_INSTALLATION_REPOSITORY_SELECTION_SELECTED = 2; }
enum GitHubInstallationLifecycleStatus { GITHUB_INSTALLATION_LIFECYCLE_STATUS_UNSPECIFIED = 0; GITHUB_INSTALLATION_LIFECYCLE_STATUS_ACTIVE = 1; GITHUB_INSTALLATION_LIFECYCLE_STATUS_SUSPENDED = 2; GITHUB_INSTALLATION_LIFECYCLE_STATUS_DELETED = 3; }
enum GitHubRepositoryAccessStatus { GITHUB_REPOSITORY_ACCESS_STATUS_UNSPECIFIED = 0; GITHUB_REPOSITORY_ACCESS_STATUS_ACTIVE = 1; GITHUB_REPOSITORY_ACCESS_STATUS_INACCESSIBLE = 2; GITHUB_REPOSITORY_ACCESS_STATUS_DELETED = 3; }
enum GitHubWorkflowState { GITHUB_WORKFLOW_STATE_UNSPECIFIED = 0; GITHUB_WORKFLOW_STATE_ACTIVE = 1; GITHUB_WORKFLOW_STATE_DISABLED = 2; }
enum GitHubWorkflowCompatibility { GITHUB_WORKFLOW_COMPATIBILITY_UNSPECIFIED = 0; GITHUB_WORKFLOW_COMPATIBILITY_COMPATIBLE = 1; GITHUB_WORKFLOW_COMPATIBILITY_INCOMPATIBLE = 2; GITHUB_WORKFLOW_COMPATIBILITY_UNAVAILABLE = 3; }
enum GitConnectionStatus { GIT_CONNECTION_STATUS_UNSPECIFIED = 0; GIT_CONNECTION_STATUS_ACTIVE = 1; GIT_CONNECTION_STATUS_SUSPENDED = 2; GIT_CONNECTION_STATUS_INACCESSIBLE = 3; GIT_CONNECTION_STATUS_DELETED = 4; GIT_CONNECTION_STATUS_DISCONNECTED = 5; }
enum ImportOperationState { IMPORT_OPERATION_STATE_UNSPECIFIED = 0; IMPORT_OPERATION_STATE_PENDING = 1; IMPORT_OPERATION_STATE_CREDENTIAL_PENDING = 2; IMPORT_OPERATION_STATE_COMMITTING = 3; IMPORT_OPERATION_STATE_PENDING_DISPATCH = 4; IMPORT_OPERATION_STATE_COMPLETED = 5; IMPORT_OPERATION_STATE_FAILED = 6; IMPORT_OPERATION_STATE_CANCELLED = 7; }
enum GhcrCredentialState { GHCR_CREDENTIAL_STATE_UNSPECIFIED = 0; GHCR_CREDENTIAL_STATE_NOT_CONFIGURED = 1; GHCR_CREDENTIAL_STATE_CREATING = 2; GHCR_CREDENTIAL_STATE_READY = 3; GHCR_CREDENTIAL_STATE_ROTATING = 4; GHCR_CREDENTIAL_STATE_RECONCILING = 5; GHCR_CREDENTIAL_STATE_FAILED = 6; }
enum OciAnnotationPolicy { OCI_ANNOTATION_POLICY_UNSPECIFIED = 0; OCI_ANNOTATION_POLICY_VALIDATE_IF_PRESENT = 1; }
