syntax = "proto3";

package cyclopus.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/error_details.proto";

option go_package = "github.com/shepard-labs/cyclopus/gen/go/cyclopus/v1;cyclopusv1";

// The imported error detail messages are the required typed error vocabulary.
message ErrorDetailTypes {
  google.rpc.ErrorInfo error_info = 1;
  google.rpc.BadRequest bad_request = 2;
}

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_PRODUCTION = 1;
  ENVIRONMENT_KIND_PREVIEW = 2;
}

enum EnvironmentLifecycleStatus {
  ENVIRONMENT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  ENVIRONMENT_LIFECYCLE_STATUS_RESERVED = 1;
  ENVIRONMENT_LIFECYCLE_STATUS_POLICY_BLOCKED = 2;
  ENVIRONMENT_LIFECYCLE_STATUS_READY = 3;
  ENVIRONMENT_LIFECYCLE_STATUS_TEARDOWN_REQUESTED = 4;
  ENVIRONMENT_LIFECYCLE_STATUS_TORN_DOWN = 5;
  ENVIRONMENT_LIFECYCLE_STATUS_FAILED = 6;
}

enum ScalingMode {
  SCALING_MODE_UNSPECIFIED = 0;
  SCALING_MODE_HPA = 1;
  SCALING_MODE_KEDA_CRON = 2;
  SCALING_MODE_KEDA_HTTP = 3;
}

enum RuntimeClass {
  RUNTIME_CLASS_UNSPECIFIED = 0;
  RUNTIME_CLASS_GVISOR = 1;
  RUNTIME_CLASS_RUNC = 2;
}

enum ReleaseKind {
  RELEASE_KIND_UNSPECIFIED = 0;
  RELEASE_KIND_DEPLOY = 1;
  RELEASE_KIND_ENV_CHANGE = 2;
  RELEASE_KIND_ROLLBACK = 3;
  RELEASE_KIND_RECONCILE = 4;
}

enum ReleaseStatus {
  RELEASE_STATUS_UNSPECIFIED = 0;
  RELEASE_STATUS_PENDING = 1;
  RELEASE_STATUS_DEPLOYING = 2;
  RELEASE_STATUS_LIVE = 3;
  RELEASE_STATUS_FAILED = 4;
  RELEASE_STATUS_SUPERSEDED = 5;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_QUEUED = 1;
  OPERATION_STATUS_RUNNING = 2;
  OPERATION_STATUS_SUCCEEDED = 3;
  OPERATION_STATUS_FAILED = 4;
  OPERATION_STATUS_CANCELLED = 5;
}

enum CreateApiTokenResult {
  CREATE_API_TOKEN_RESULT_UNSPECIFIED = 0;
  CREATE_API_TOKEN_RESULT_CREATED = 1;
  CREATE_API_TOKEN_RESULT_ALREADY_CREATED_SECRET_NOT_REPLAYABLE = 2;
}

enum ReconcileScopeKind {
  RECONCILE_SCOPE_KIND_UNSPECIFIED = 0;
  RECONCILE_SCOPE_KIND_ORGANIZATION = 1;
  RECONCILE_SCOPE_KIND_APPLICATION = 2;
  RECONCILE_SCOPE_KIND_ENVIRONMENT = 3;
}

enum ReconcileCategory {
  RECONCILE_CATEGORY_UNSPECIFIED = 0;
  RECONCILE_CATEGORY_DATABASE = 1;
  RECONCILE_CATEGORY_NAMESPACE = 2;
  RECONCILE_CATEGORY_WORKLOAD = 3;
  RECONCILE_CATEGORY_NETWORK_POLICY = 4;
  RECONCILE_CATEGORY_INGRESS = 5;
  RECONCILE_CATEGORY_TLS = 6;
  RECONCILE_CATEGORY_SCALING = 7;
  RECONCILE_CATEGORY_ENVIRONMENT_VARIABLES = 8;
  RECONCILE_CATEGORY_ORCHESTRATION = 9;
}

enum ReconcileFindingStatus {
  RECONCILE_FINDING_STATUS_UNSPECIFIED = 0;
  RECONCILE_FINDING_STATUS_IN_SYNC = 1;
  RECONCILE_FINDING_STATUS_DRIFTED = 2;
  RECONCILE_FINDING_STATUS_MISSING = 3;
  RECONCILE_FINDING_STATUS_ORPHANED = 4;
  RECONCILE_FINDING_STATUS_ERROR = 5;
}

// LogSeverity is the coarse severity band a log query may filter on. Cyclopus
// maps it to an OpenObserve severity predicate that is ANDed onto the mandatory
// tenant filter; it can never widen scope.
enum LogSeverity {
  LOG_SEVERITY_UNSPECIFIED = 0;
  LOG_SEVERITY_TRACE = 1;
  LOG_SEVERITY_DEBUG = 2;
  LOG_SEVERITY_INFO = 3;
  LOG_SEVERITY_WARN = 4;
  LOG_SEVERITY_ERROR = 5;
  LOG_SEVERITY_FATAL = 6;
}

enum TraceStatus {
  TRACE_STATUS_UNSPECIFIED = 0;
  TRACE_STATUS_OK = 1;
  TRACE_STATUS_ERROR = 2;
}

message User {
  string id = 1;
  string organization_id = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  string first_name = 5;
  string last_name = 6;
  string display_name = 7;
  string avatar_key = 8;
}

message Session {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message ApiToken {
  string id = 1;
  string user_id = 2;
  string name = 3;
  repeated string scopes = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp deleted_at = 5;
}

message Project {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
  string git_connection_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp deleted_at = 7;
}

message KedaCronSchedule {
  // IANA timezone name for the cron window (for example "Europe/Berlin").
  string timezone = 1;
  // 5-field cron expression marking the start of the scale-out window.
  string start = 2;
  // 5-field cron expression marking the end of the scale-out window.
  string end = 3;
  // Replicas to hold during the window.
  int32 desired_replicas = 4;
}

message Application {
  string id = 1;
  string organization_id = 2;
  string project_id = 3;
  string name = 4;
  string slug = 5;
  string hostname_label = 6;
  string registry_id = 7;
  string image_repository = 8;
  int32 container_port = 9;
  string health_check_path = 10;
  ScalingMode scaling_mode = 11;
  int32 min_replicas = 12;
  int32 max_replicas = 13;
  int32 hpa_target_cpu_percent = 14;
  int32 cpu_request_millicores = 15;
  int32 cpu_limit_millicores = 16;
  int32 memory_request_mib = 17;
  int32 memory_limit_mib = 18;
  bool previews_enabled = 19;
  int32 max_preview_environments = 20;
  int32 preview_idle_ttl_hours = 21;
  int32 deploy_timeout_seconds = 22;
  int32 release_retention_count = 23;
  RuntimeClass runtime_class = 24;
  string ci_workflow_id = 25;
  google.protobuf.Timestamp created_at = 26;
  google.protobuf.Timestamp deleted_at = 27;
  // Cron windows applied when scaling_mode is KEDA_CRON; must be non-empty
  // for that mode and is ignored otherwise.
  repeated KedaCronSchedule keda_cron_schedules = 28;
  // HTTP add-on concurrency target applied when scaling_mode is KEDA_HTTP.
  int32 keda_http_target_pending_requests = 29;
}

message Environment {
  string id = 1;
  string organization_id = 2;
  string application_id = 3;
  string branch = 4;
  EnvironmentKind kind = 5;
  string preview_slug = 6;
  string namespace = 7;
  string planned_hostname = 8;
  string current_release_id = 9;
  string in_progress_release_id = 10;
  string current_env_var_revision_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp torn_down_at = 13;
  EnvironmentLifecycleStatus lifecycle_status = 14;
  string lifecycle_reason = 15;
  string lifecycle_error_code = 16;
  string lifecycle_error_message = 17;
  google.protobuf.Timestamp teardown_requested_at = 18;
}

message PreviewPushRequest {
  string application_id = 1;
  string branch = 2;
  string commit_sha = 3;
  string idempotency_key = 4;
}
message PreviewPushResponse {
  Environment environment = 1;
  string disposition = 2;
  bool dropped = 3;
}

message PreviewBranchDeleteRequest {
  string application_id = 1;
  string branch = 2;
  string idempotency_key = 3;
}
message PreviewBranchDeleteResponse { Environment environment = 1; }

message TeardownEnvironmentRequest {
  string environment_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}
message TeardownEnvironmentResponse { Environment environment = 1; }

message Release {
  string id = 1;
  string organization_id = 2;
  string environment_id = 3;
  string image_ref = 4;
  string git_commit_sha = 5;
  string triggered_by_user_id = 6;
  ReleaseKind kind = 7;
  string env_var_revision_id = 8;
  ReleaseStatus status = 9;
  string failure_reason = 10;
  google.protobuf.Timestamp created_at = 11;
}

message EnvironmentVariable {
  string key = 1;
  bool secret = 2;
  string value = 3;
}

message EnvironmentVariableRevision {
  string id = 1;
  string organization_id = 2;
  string environment_id = 3;
  int64 revision = 4;
  string created_by_user_id = 5;
  repeated EnvironmentVariable variables = 6;
  google.protobuf.Timestamp created_at = 7;
}

message WebhookEndpoint {
  string id = 1;
  string organization_id = 2;
  string target_url = 3;
  repeated string events = 4;
  string secret_ref = 5;
  bool enabled = 6;
  int32 consecutive_failures = 7;
  google.protobuf.Timestamp disabled_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateWebhookRequest {
  string organization_id = 1;
  WebhookEndpoint webhook = 2;
  string idempotency_key = 3;
}
message CreateWebhookResponse { WebhookEndpoint webhook = 1; }
message GetWebhookRequest { string webhook_id = 1; }
message GetWebhookResponse { WebhookEndpoint webhook = 1; }
message ListWebhooksRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListWebhooksResponse {
  repeated WebhookEndpoint webhooks = 1;
  string next_page_token = 2;
}
message UpdateWebhookRequest {
  WebhookEndpoint webhook = 1;
  google.protobuf.FieldMask update_mask = 2;
  string idempotency_key = 3;
}
message UpdateWebhookResponse { WebhookEndpoint webhook = 1; }
message DeleteWebhookRequest {
  string webhook_id = 1;
  string idempotency_key = 2;
}
message DeleteWebhookResponse {}

// DomainVerificationMethod selects how a custom domain proves control (§7.5).
// CNAME is used for subdomains (the CNAME both proves control and routes
// traffic); DNS_TXT is used for apex/root domains via a challenge TXT record.
enum DomainVerificationMethod {
  DOMAIN_VERIFICATION_METHOD_UNSPECIFIED = 0;
  DOMAIN_VERIFICATION_METHOD_DNS_TXT = 1;
  DOMAIN_VERIFICATION_METHOD_CNAME = 2;
}

message Domain {
  string id = 1;
  string organization_id = 2;
  string application_id = 3;
  string hostname = 4;
  DomainVerificationMethod verification_method = 5;
  // verification_token is only populated for dns_txt domains; it is the value
  // the customer must publish in the challenge TXT record. It is null/empty for
  // cname domains.
  string verification_token = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp created_at = 8;
  // instructions describes the exact DNS record the customer must create to
  // complete verification and, for dns_txt, the follow-up A record.
  DomainDnsInstructions instructions = 9;
}

// DomainDnsInstructions is the operator-facing guidance the UI/CLI renders so
// the customer can create the records Cyclopus checks (§7.5).
message DomainDnsInstructions {
  // record_type is "CNAME" or "TXT".
  string record_type = 1;
  // record_name is the fully-qualified name the customer creates the record on
  // (e.g. "app.customer.com" for CNAME, "_cyclopus-challenge.customer.com" for
  // TXT).
  string record_name = 2;
  // record_value is the expected value: the ingress target for CNAME, or the
  // challenge token for TXT.
  string record_value = 3;
  // apex_a_record_target is set for dns_txt domains only: after verification the
  // customer points an A record at this ingress IP/target. Cyclopus does not
  // verify this record in this phase; it is operational guidance.
  string apex_a_record_target = 4;
}

message CreateDomainRequest {
  string application_id = 1;
  Domain domain = 2;
  string idempotency_key = 3;
}
message CreateDomainResponse { Domain domain = 1; }
message GetDomainRequest { string domain_id = 1; }
message GetDomainResponse { Domain domain = 1; }
message ListDomainsRequest {
  string application_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListDomainsResponse {
  repeated Domain domains = 1;
  string next_page_token = 2;
}
message VerifyDomainRequest {
  string domain_id = 1;
  string idempotency_key = 2;
}
message VerifyDomainResponse { Domain domain = 1; }
message DeleteDomainRequest {
  string domain_id = 1;
  string idempotency_key = 2;
}
message DeleteDomainResponse {}

// Registry is one row of the registries table: an OCI image registry an app
// pulls container images from. credential_secret_ref is a
// k8s-secret://<namespace>/<name>#<key> REFERENCE to the pull credential; the
// raw credential is never accepted or stored in Postgres — only the reference.
message Registry {
  string id = 1;
  string organization_id = 2;
  // provider identifies the registry flavour: one of "ghcr", "gcr", "ecr",
  // "other".
  string provider = 3;
  string registry_url = 4;
  // credential_secret_ref is a k8s-secret://<namespace>/<name>#<key> reference
  // to the pull credential, NOT a plaintext credential.
  string credential_secret_ref = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateRegistryRequest {
  string organization_id = 1;
  Registry registry = 2;
  string idempotency_key = 3;
}
message CreateRegistryResponse { Registry registry = 1; }
message GetRegistryRequest { string registry_id = 1; }
message GetRegistryResponse { Registry registry = 1; }
message ListRegistriesRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListRegistriesResponse {
  repeated Registry registries = 1;
  string next_page_token = 2;
}
message DeleteRegistryRequest {
  string registry_id = 1;
  string idempotency_key = 2;
}
message DeleteRegistryResponse {}

// GitConnection is one row of the git_connections table: a GitHub App
// installation bound to a single repository. webhook_secret_ref is a
// k8s-secret://<namespace>/<name>#<key> REFERENCE to the webhook signing
// secret; the raw secret is never accepted or stored in Postgres.
message GitConnection {
  string id = 1;
  string organization_id = 2;
  // provider is "github" (the only supported value in v1).
  string provider = 3;
  int64 installation_id = 4;
  string repo_full_name = 5;
  string default_branch = 6;
  // webhook_secret_ref is a k8s-secret://<namespace>/<name>#<key> reference to
  // the webhook signing secret, NOT a plaintext secret.
  string webhook_secret_ref = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateGitConnectionRequest {
  string organization_id = 1;
  GitConnection git_connection = 2;
  string idempotency_key = 3;
}
message CreateGitConnectionResponse { GitConnection git_connection = 1; }
message GetGitConnectionRequest { string git_connection_id = 1; }
message GetGitConnectionResponse { GitConnection git_connection = 1; }
message ListGitConnectionsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListGitConnectionsResponse {
  repeated GitConnection git_connections = 1;
  string next_page_token = 2;
}
message DeleteGitConnectionRequest {
  string git_connection_id = 1;
  string idempotency_key = 2;
}
message DeleteGitConnectionResponse {}

// Alias is one row of the aliases table: a bookkeeping record of which release
// currently serves at a hostname for an environment (§3.7). There is at most
// one alias per environment (UNIQUE(environment_id)).
message Alias {
  string id = 1;
  string organization_id = 2;
  string environment_id = 3;
  string hostname = 4;
  string release_id = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetAliasRequest { string alias_id = 1; }
message GetAliasResponse { Alias alias = 1; }
message ListAliasesRequest {
  string environment_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListAliasesResponse {
  repeated Alias aliases = 1;
  string next_page_token = 2;
}

// AuditEvent is one row of the audit_events table: an immutable record of a
// control-plane mutation (§9). before/after carry the prior and resulting
// resource state as JSON objects. These are org-scoped; a caller can only read
// their own org's audit trail. The stored `after` for secret-bearing resources
// (e.g. registries) contains the secret REFERENCE, never a plaintext secret.
message AuditEvent {
  string id = 1;
  string organization_id = 2;
  // actor_user_id is the user who performed the action; empty for
  // system-originated events.
  string actor_user_id = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  // before/after are the JSON object states of the target resource. They are
  // exposed as google.protobuf.Struct because the stored jsonb is always a JSON
  // object (or null), mapping cleanly to Struct; this preserves structure for
  // clients rather than an opaque string.
  google.protobuf.Struct before = 7;
  google.protobuf.Struct after = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListAuditEventsRequest {
  string organization_id = 1;
  // Optional filters. When set, only events whose target matches are returned.
  string target_type = 2;
  string target_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}
message ListAuditEventsResponse {
  repeated AuditEvent audit_events = 1;
  string next_page_token = 2;
}

// CertificateStatus is the live status of a cert-manager Certificate serving an
// environment's hostname, read directly from the cluster (read-only, §6). It is
// not stored in Postgres; it is projected from the Certificate CRD's spec and
// status. ready reflects the Ready condition; reason carries the condition's
// message; not_after is the certificate expiry when known.
message CertificateStatus {
  string hostname = 1;
  string secret_name = 2;
  bool ready = 3;
  string reason = 4;
  google.protobuf.Timestamp not_after = 5;
  string issuer = 6;
  repeated string dns_names = 7;
}

message ListCertificatesRequest { string environment_id = 1; }
message ListCertificatesResponse { repeated CertificateStatus certificates = 1; }

message Operation {
  string id = 1;
  OperationStatus status = 2;
  string resource_name = 3;
}

message ReconcileScope {
  ReconcileScopeKind kind = 1;
  string organization_id = 2;
  string application_id = 3;
  string environment_id = 4;
}

message ReconcileFinding {
  ReconcileCategory category = 1;
  ReconcileFindingStatus status = 2;
  string resource_name = 3;
  string summary = 4;
  oneof details {
    RuntimeClassDriftFinding runtime_class_drift = 5;
    NetworkPolicyDriftFinding network_policy_drift = 6;
  }
  google.protobuf.Timestamp observed_at = 7;
}

message RuntimeClassDriftFinding {
  string expected_runtime_class = 1;
  string observed_runtime_class = 2;
}

message NetworkPolicyDriftFinding {
  repeated string missing_policies = 1;
}

message ReconciliationObject {
  string kind = 1;
  string namespace = 2;
  string name = 3;
}

message ReconciliationPlanOperation {
  ReconciliationObject object = 1;
  string desired_hash = 2;
  string observed_hash = 3;
  google.protobuf.Value details = 4;
}

message ReconciliationPlan {
  repeated ReconciliationPlanOperation create = 1;
  repeated ReconciliationPlanOperation patch = 2;
  repeated ReconciliationPlanOperation delete = 3;
}

message ReconciliationReport {
  repeated ReconciliationObject orphans = 1;
  repeated ReconciliationObject pruned = 2;
  int32 planned = 3;
  int32 applied = 4;
  bool dry_run = 5;
}

message ReconciliationEvidence {
  int64 sequence = 1;
  string kind = 2;
  ReconciliationObject object = 3;
  string action = 4;
  string desired_hash = 5;
  string observed_hash = 6;
  google.protobuf.Value details = 7;
  google.protobuf.Timestamp observed_at = 8;
}

message ReconciliationRun {
  string id = 1;
  ReconcileScope scope = 2;
  repeated ReconcileCategory categories = 3;
  OperationStatus status = 4;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  bool dry_run = 8;
  bool prune = 9;
  ReconciliationPlan plan = 10;
  ReconciliationReport report = 11;
  repeated ReconcileFinding findings = 12;
  google.protobuf.Timestamp started_at = 13;
  string error_code = 14;
  string error_message = 15;
}

