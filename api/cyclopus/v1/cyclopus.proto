// RegistryService manages OCI image registries an app pulls images from (§6).
// The pull credential is passed as a k8s-secret:// reference, never as a raw
// secret. Deleting a registry still referenced by an app fails (FK RESTRICT).
service RegistryService {
  rpc CreateRegistry(CreateRegistryRequest) returns (CreateRegistryResponse) {
    option (google.api.http) = { post: "/v1/organizations/{organization_id}/registries" body: "registry" };
  }
  rpc GetRegistry(GetRegistryRequest) returns (GetRegistryResponse) {
    option (google.api.http) = { get: "/v1/registries/{registry_id}" };
  }
  rpc ListRegistries(ListRegistriesRequest) returns (ListRegistriesResponse) {
    option (google.api.http) = { get: "/v1/organizations/{organization_id}/registries" };
  }
  rpc DeleteRegistry(DeleteRegistryRequest) returns (DeleteRegistryResponse) {
    option (google.api.http) = { delete: "/v1/registries/{registry_id}" };
  }
}

// GitConnectionService manages GitHub App installations bound to a repository
// (§6). The webhook signing secret is passed as a k8s-secret:// reference,
// never as a raw secret. Deleting a git connection nulls referencing projects
// (FK SET NULL).
service GitConnectionService {
  rpc CreateGitConnection(CreateGitConnectionRequest) returns (CreateGitConnectionResponse) {
    option (google.api.http) = { post: "/v1/organizations/{organization_id}/git-connections" body: "git_connection" };
  }
  rpc GetGitConnection(GetGitConnectionRequest) returns (GetGitConnectionResponse) {
    option (google.api.http) = { get: "/v1/git-connections/{git_connection_id}" };
  }
  rpc ListGitConnections(ListGitConnectionsRequest) returns (ListGitConnectionsResponse) {
    option (google.api.http) = { get: "/v1/organizations/{organization_id}/git-connections" };
  }
  rpc DeleteGitConnection(DeleteGitConnectionRequest) returns (DeleteGitConnectionResponse) {
    option (google.api.http) = { delete: "/v1/git-connections/{git_connection_id}" };
  }
}

// ObservabilityService proxies OpenObserve logs/traces and Beszel metrics.
// The upstream backends are never exposed directly: every read is server-side
// proxied and, for logs/traces, scoped by a mandatory tenant filter Cyclopus
// builds from validated IDs. Operator metrics are install-level only.
service ObservabilityService {
  rpc QueryApplicationLogs(QueryApplicationLogsRequest) returns (QueryApplicationLogsResponse) {
    option (google.api.http) = { get: "/v1/applications/{application_id}/logs" };
  }
  rpc ListApplicationTraces(ListApplicationTracesRequest) returns (ListApplicationTracesResponse) {
    option (google.api.http) = { get: "/v1/applications/{application_id}/traces" };
  }
  rpc GetApplicationTrace(GetApplicationTraceRequest) returns (GetApplicationTraceResponse) {
    option (google.api.http) = { get: "/v1/applications/{application_id}/traces/{trace_id}" };
  }
  rpc GetOperatorMetrics(GetOperatorMetricsRequest) returns (GetOperatorMetricsResponse) {
    option (google.api.http) = { get: "/v1/operator/metrics" };
  }
}

// AliasService reads the aliases bookkeeping table: which release currently
// serves at an environment's hostname (§3.7). Read-only in v1; org-scoped.
service AliasService {
  rpc GetAlias(GetAliasRequest) returns (GetAliasResponse) {
    option (google.api.http) = { get: "/v1/aliases/{alias_id}" };
  }
  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse) {
    option (google.api.http) = { get: "/v1/environments/{environment_id}/aliases" };
  }
}

// AuditEventService reads the org-scoped audit trail (§9). Read-only; a caller
// can only read their own organization's events, most-recent first.
service AuditEventService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option (google.api.http) = { get: "/v1/organizations/{organization_id}/audit-events" };
  }
}

// CertificateService reads live cert-manager Certificate status from the
// cluster for an environment (read-only, §6). Org-scoping is enforced by
// resolving the environment within the caller's org before reading only the
// Certificates in that environment's Cyclopus-managed namespace.
service CertificateService {
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse) {
    option (google.api.http) = { get: "/v1/environments/{environment_id}/certificates" };
  }
}
