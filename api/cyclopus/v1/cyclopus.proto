}
message GitHubWorkflow {
  string path = 1; string name = 2; GitHubWorkflowState state = 3; GitHubWorkflowCompatibility compatibility = 4;
  // Stable, deterministic reason codes emitted only by the approved narrow parser.
  repeated string incompatibility_reasons = 5;
}
message GitConnection {
  reserved 2 to 8;
  reserved "organization_id", "provider", "installation_id", "repo_full_name", "default_branch", "webhook_secret_ref", "created_at";
  string id = 1; GitHubRepository repository = 9; GitConnectionStatus status = 10;
  google.protobuf.Timestamp connected_at = 11; google.protobuf.Timestamp disconnected_at = 12;
}
message GhcrCredential {
  // Input-only and sensitive. Never returned, logged, or persisted in PostgreSQL.
  string username = 1;
  // Input-only and sensitive PAT classic with read:packages. Never returned or logged.
  string personal_access_token = 2 [(google.api.field_behavior) = INPUT_ONLY];
}
message GhcrCredentialStatus {
  bool configured = 1; int64 generation = 2; GhcrCredentialState state = 3; IntegrationFailureCode failure_code = 4;
  string failure_message = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7;
}
message ImportOperation {
