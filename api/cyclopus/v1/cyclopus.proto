  string release_id = 2;
  string idempotency_key = 3;
}
message RollbackResponse { Operation operation = 1; }

message GetReleaseRequest { string release_id = 1; }
message GetReleaseResponse { Release release = 1; }

message ListReleasesRequest {
  string environment_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated ReleaseStatus statuses = 4;
}

message ListReleasesResponse {
  repeated Release releases = 1;
  string next_page_token = 2;
}

message GetEnvironmentVariablesRequest { string environment_id = 1; }
message GetEnvironmentVariablesResponse { EnvironmentVariableRevision revision = 1; }

message SetEnvironmentVariablesRequest {
  string environment_id = 1;
  repeated EnvironmentVariable variables = 2;
  string idempotency_key = 3;
}
message SetEnvironmentVariablesResponse { Operation operation = 1; }

message StartReconciliationRequest {
  ReconcileScope scope = 1;
  repeated ReconcileCategory categories = 2;
  string idempotency_key = 3;
  optional bool dry_run = 4;
  bool prune = 5;
}
message StartReconciliationResponse { Operation operation = 1; }

message GetReconciliationRequest { string reconciliation_id = 1; }
message GetReconciliationResponse { ReconciliationRun reconciliation = 1; }

message ListReconciliationsRequest {
  string organization_id = 1;
  string application_id = 2;
  string environment_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListReconciliationsResponse {
  repeated ReconciliationRun reconciliations = 1;
  string next_page_token = 2;
}

message ListReconciliationEvidenceRequest {
  string reconciliation_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListReconciliationEvidenceResponse {
  repeated ReconciliationEvidence evidence = 1;
  string next_page_token = 2;
}

// LogEntry is a single tenant-scoped log record returned from OpenObserve. The
// tenant fields that determine ownership are stamped by the OpenTelemetry
// Collector at ingest (spec 8.1), never claimed by the app.
message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  LogSeverity severity = 2;
  string body = 3;
  map<string, string> attributes = 4;
}

message QueryApplicationLogsRequest {
  // Required: the application whose logs are requested. Ownership is validated
  // against the caller's organization before any upstream query is issued.
  string application_id = 1;
  // Optional additional scoping. When set they must belong to application_id.
  string environment_id = 2;
  string release_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  // Optional coarse severity floor. Records below it are excluded.
  LogSeverity min_severity = 6;
  // Optional free-text substring filter. Validated as a safe literal and ANDed
  // onto the mandatory tenant filter; it cannot remove or widen tenant scope.
  string query = 7;
  int32 limit = 8;
  string cursor = 9;
}

message QueryApplicationLogsResponse {
  repeated LogEntry entries = 1;
  string next_cursor = 2;
}

message TraceSummary {
  string trace_id = 1;
  string root_name = 2;
  int64 duration_ms = 3;
  google.protobuf.Timestamp start_time = 4;
  TraceStatus status = 5;
}

message ListApplicationTracesRequest {
  string application_id = 1;
  string environment_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 limit = 5;
  string cursor = 6;
}

message ListApplicationTracesResponse {
  repeated TraceSummary traces = 1;
  string next_cursor = 2;
}

message GetApplicationTraceRequest {
  string application_id = 1;
  string trace_id = 2;
  string environment_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
}

message GetApplicationTraceResponse { TraceSummary trace = 1; }

// OperatorMetric is one install-level host/system metric proxied from Beszel.
// These are NOT tenant-scoped: they describe the operator's own hosts and carry
// no per-application attribution (spec 8, design note: Beszel is operator/
// install-level bounded metrics, not a transparent per-tenant proxy).
message OperatorMetric {
  string name = 1;
  double value = 2;
  string unit = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message GetOperatorMetricsRequest {}

message GetOperatorMetricsResponse {
  // Operator-level only. Any authenticated org member may read these; they are
  // deliberately install-scoped and expose no tenant data.
  repeated OperatorMetric metrics = 1;
}

