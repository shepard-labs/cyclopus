message BeginGitHubInstallationResponse { BeginGitHubFlowResponse flow = 1; }
message GetGitHubInstallationRequest { string installation_id = 1; }
message GetGitHubInstallationResponse { GitHubInstallation installation = 1; }
message ListGitHubInstallationsRequest { int32 page_size = 1; string page_token = 2; }
message ListGitHubInstallationsResponse { repeated GitHubInstallation installations = 1; string next_page_token = 2; }
message RefreshGitHubInstallationRequest { string installation_id = 1; string idempotency_key = 2; }
message RefreshGitHubInstallationResponse { GitHubInstallation installation = 1; }
message ListGitHubRepositoriesRequest { string installation_id = 1; int32 page_size = 2; string page_token = 3; }
message ListGitHubRepositoriesResponse { repeated GitHubRepository repositories = 1; string next_page_token = 2; }
message ListGitHubRepositoryWorkflowsRequest { int64 repository_id = 1; int32 page_size = 2; string page_token = 3; }
message ListGitHubRepositoryWorkflowsResponse { repeated GitHubWorkflow workflows = 1; string next_page_token = 2; }
