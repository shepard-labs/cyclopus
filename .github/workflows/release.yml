name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cyclopus-dev/cyclopus
  CHART_REGISTRY: ghcr.io/cyclopus-dev/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release
      packages: write   # push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: reuse across runs; invalidated when go.sum or source changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.3

      - name: Push Helm chart to ghcr.io
        run: |
          # Strip leading 'v' to get a semver chart version (e.g. v0.2.0 → 0.2.0).
          VERSION="${GITHUB_REF_NAME#v}"

          # Stamp Chart.yaml with the release version so the chart and image
          # version stay in sync. The chart version and appVersion are always equal.
          sed -i "s/^version:.*/version: ${VERSION}/" charts/cyclopus/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/cyclopus/Chart.yaml

          helm package charts/cyclopus

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          helm push "cyclopus-${VERSION}.tgz" "oci://${{ env.CHART_REGISTRY }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: cyclopus-*.tgz
          generate_release_notes: true
