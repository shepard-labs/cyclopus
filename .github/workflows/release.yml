name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/shepard-labs/cyclopus
  CHART_REGISTRY: ghcr.io/shepard-labs/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub release + push tag
      packages: write   # push to ghcr.io
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full tag history to compute next version

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v0.1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: reuse across runs; invalidated when go.sum or source changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Push Helm chart to ghcr.io
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # Strip leading 'v' to get a semver chart version (e.g. v0.2.0 → 0.2.0).
          VERSION="${TAG#v}"

          # Stamp Chart.yaml with the release version so the chart and image
          # version stay in sync. The chart version and appVersion are always equal.
          sed -i "s/^version:.*/version: ${VERSION}/" charts/cyclopus/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/cyclopus/Chart.yaml

          helm package charts/cyclopus

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

          helm push "cyclopus-${VERSION}.tgz" "oci://${{ env.CHART_REGISTRY }}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: cyclopus-*.tgz
          generate_release_notes: true

  # Offline install bundle: single artifact consumed by scripts/install.sh so a
  # fresh VPS needs ONE download instead of ~30 serialized fetches + all image
  # pulls. Depends on the release job's pushed chart + image.
  bundle:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the bundle to the GitHub release
      packages: read    # pull the cyclopus chart + image from ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ghcr.io (helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build offline bundle
        run: bash ./scripts/build_bundle.sh "${{ needs.release.outputs.version }}"

      - name: Attach bundle to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.version }}
          files: cyclopus-bundle-*.tar.zst*
